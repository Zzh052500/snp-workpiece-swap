name: snp-automate-2023-polishing-simulation
services:
  snp_automate_2023_sim:
    image: ghcr.io/ros-industrial-consortium/snp_automate_2023:jazzy-master
    container_name: snp_automate_2023_sim
    environment:
      HOME: /workspace/snp_home
      DISPLAY: ${DISPLAY:-:0}
      QT_QPA_PLATFORM: xcb
      QT_X11_NO_MITSHM: "1"
      SNP_SIM_ROBOT: "true"
      SNP_SIM_VISION: "true"
      SNP_BYPASS_EXECUTION: "true"
      ROS_LOG_DIR: /workspace/snp_home/.ros
      ROS_DOMAIN_ID: "42"
    user: "${CURRENT_UID:-1000:1000}"
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host

    # --- 防「整机卡死」加固 ---
    # Docker 默认给容器的 /dev/shm 只有 64MB。RViz / DDS / Qt 都走 shm，
    # 64MB 在加载网格和轨迹时会顶到上限，表现为 RViz 卡住或直接退出。
    shm_size: 512m

    # --- 容器内存上限：默认【不限制】，与原厂一致 ---
    #
    # 原厂 compose 里根本没有 mem_limit（`git show HEAD:docker/compose.sim.yml` 只有 image:）。
    # 抛光运动规划峰值要吃到 3GB 以上，一个小上限会把它直接 SIGKILL —— 这正是
    # 「以前能跑、后来跑不通」的原因，详见 README §4.11。
    #
    #   0 = 不限制。大内存机器（≥16GB）就用这个，让规划吃饱。
    #       代价：容器内存失控时内核会拿整个主机去 swap，桌面会僵死。
    #
    #   小内存机器（本机 5.7GB、swap 已满）请显式设上限，否则会重演「电脑直接卡死」：
    #       export SNP_MEM_LIMIT=3g && docker compose -f docker/compose.sim.yml up -d
    #       设了之后越界的是容器内单进程被 OOM kill（docker start 几秒就回来），
    #       而不是整台机器失去响应。
    #
    # memswap_limit == mem_limit 即为禁止容器使用 swap。
    mem_limit: ${SNP_MEM_LIMIT:-0}
    memswap_limit: ${SNP_MEM_LIMIT:-0}

    # 日志轮转。snp_motion_planning_node 会刷大量
    # "Debug: Environment, getKinematicGroup(manipulator, ) cache hit!"，
    # 默认 json-file 驱动没有任何上限，长时间运行会把磁盘写满。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../runtime/snp_home:/workspace/snp_home
      - ../config:/workspace/config:ro
      - ../config:/opt/snp_automate_2023/install/snp_automate_2023/share/snp_automate_2023/config:ro
      - ../launch:/opt/snp_automate_2023/install/snp_automate_2023/share/snp_automate_2023/launch:ro
      - ../meshes:/opt/snp_automate_2023/install/snp_automate_2023/share/snp_automate_2023/meshes
